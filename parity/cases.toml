# Matriz de paridade do Hades-Core: o probe TS (parity/ts-probe.ts) contra o hades-core-probe Rust.

[[case]]
id = "core.pyjson.basico"
argv = ["pyjson", '{"a":[1,2,{"b":null}],"c":"x","d":true}']
ts_cmd = ["{cases_dir}/ts-probe.ts"]

