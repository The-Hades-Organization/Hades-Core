name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # sha do Hades-Skill contra o qual o job parity roda; trocar é mudança explícita, e o diff da matriz mostra o que mudou no TS
  HADES_SKILL_SHA: 143cf966c609088a8c49ee73dc8afdfb5075d46f

permissions:
  contents: read

jobs:
  core:
    name: Core (sem gpui)
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  parity:
    name: Paridade TS x Rust
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    env:
      HADES_SKILL_TOKEN: ${{ secrets.HADES_SKILL_TOKEN }}
    steps:
      - name: Segredo de leitura do Hades-Skill
        id: skill
        run: |
          if [ -n "$HADES_SKILL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HADES_SKILL_TOKEN ausente: a paridade com o TS não rodou neste job"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.skill.outputs.enabled == 'true'
      - uses: actions/checkout@v7
        if: steps.skill.outputs.enabled == 'true'
        with:
          repository: The-Hades-Organization/Hades-Skill
          ref: ${{ env.HADES_SKILL_SHA }}
          token: ${{ secrets.HADES_SKILL_TOKEN }}
          path: hades-skill
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.skill.outputs.enabled == 'true'
        with:
          bun-version: 1.4.4 # a do bun.lock da skill
      - name: Dependências da skill
        if: steps.skill.outputs.enabled == 'true'
        working-directory: hades-skill
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        if: steps.skill.outputs.enabled == 'true'
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        if: steps.skill.outputs.enabled == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build do runner e do probe
        if: steps.skill.outputs.enabled == 'true'
        run: cargo build --locked -p hades-parity --bins
      - name: Matriz de paridade
        if: steps.skill.outputs.enabled == 'true'
        run: >
          target/debug/hades-parity run
          --cases parity/cases.toml
          --ts "$GITHUB_WORKSPACE/hades-skill"
          --rust target/debug/hades-core-probe
