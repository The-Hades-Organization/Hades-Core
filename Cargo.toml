[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/The-Hades-Organization/Hades-Core"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["wayland", "x11"] }
gpui-component = "=0.9.0"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2
